# /etc/urbane/buttons.conf - side button and screen blanking (watch-buttond).
# Your own copy: ~/.config/urbane/buttons.conf (the menu writes there).
# Changes apply live, no restart needed.
#
# Each press type runs a shell command, or one of the built-ins:
#   @screen-toggle  @screen-off  @screen-on  @none
# Handy commands: watch-menu, watch-menu power, watch-viewport --cycle,
#   wide --toggle, watch-screen 50, watch-rotate cw, watch-viewport nav
#   (nav = touch buttons back: leaves wide/full mode, or opens the Keys page)

single=@screen-toggle
double=watch-menu
triple=watch-viewport nav
long=watch-menu power

# Switch the screen off after this many seconds without input (0 = never).
# The first touch / key press after that only wakes the screen.
IDLE_OFF=60

# Timing in milliseconds
MULTI_PRESS_MS=350
LONG_PRESS_MS=800

# Short vibration when a button action fires (1/0)
HAPTIC=1
HAPTIC_MS=40
