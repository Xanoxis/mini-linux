# /etc/urbane/frame.conf - the outer "frame" tmux of the round viewport (watch-frame).
# It only holds the side panels; every key goes to the middle pane, which shows the
# normal "watch" tmux session. Taps on a panel go to that panel; focus stays in the middle.
set -g prefix None
set -g prefix2 None
unbind -a -T prefix
unbind -a -T root
unbind -a -T copy-mode
unbind -a -T copy-mode-vi
set -g mouse on
set -g escape-time 0
set -g default-terminal "screen-256color"
set -g focus-events on
set -g set-titles off
set -g history-limit 0

set -g pane-border-lines single
set -g pane-border-style "fg=colour233"
set -g pane-active-border-style "fg=colour233"
set -g pane-border-status off

# top: line 1 time / battery / WiFi / BT, line 2 network speed + window (2/3),
# line 3 disk used/total + uptime;
# watch-frame sets 2-5 status lines to fit the font, the extra ones stay empty
set -g status-position top
set -g status-interval 3
set -g status-style "bg=default,fg=colour245"
set -g status-format[0] "#[align=centre]#[fg=colour252]#(watch-status --short)"
set -g status-format[1] "#[align=centre]#[fg=colour244]#(watch-status --net)  #[fg=colour37]#(env -u TMUX tmux display -p -t watch 'w##I/##{session_windows}')"
set -g status-format[2] "#[align=centre]#[fg=colour246]#(watch-status --info)"
set -g status-format[3] ""
set -g status-format[4] ""

# tapping the top lines opens the menu (inside the middle area)
bind -n MouseDown1Status run-shell -b "env -u TMUX watch-menu"
bind -n MouseDown1StatusDefault run-shell -b "env -u TMUX watch-menu"
