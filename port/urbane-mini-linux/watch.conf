# /etc/urbane/watch.conf - Mini Linux 0.21.4 defaults (package urbane-mini-linux). Don't edit:
#   system settings:  watch set KEY VALUE   (-> /etc/urbane/watch.local.conf)
#   display (per user): watch view / watch rotate (-> ~/.config/urbane/watch.conf)
#   all commands: watch help

# Screen layout:
#   round    - MAIN: terminal in the square inside the circle, with info panels and
#              buttons in the free parts around it (watch-frame)
#   full     - TROUBLESHOOTING: plain terminal on the whole panel (small font: "wide")
#   square   - plain terminal in the square, no panels;  balanced - plain, 264x264
VIEWPORT=round
# Picture rotation in degrees clockwise: 0 90 180 270. Change it with "watch rotate"
# (it also turns touch and restarts the screen).
ROTATE=0

# Frame panel sizes (round layout), empty = automatic: side panel columns,
# status rows at the top (2-5), button rows at the bottom (2-4). Automatic follows
# the font size (Ctrl +/-).
FRAME_SIDE=
FRAME_TOP=
FRAME_NAV=

# Terminal font (any monospace font fontconfig knows) and size in pixels.
# DejaVu Sans Mono 13 px on "round" gives about 28 columns x 15 rows.
FONT="DejaVu Sans Mono"
FONT_PX=13

# Keyboard layout for BT keyboards (XKB name): us, pl, de, ...
KEYMAP=us
KEYMAP_VARIANT=

# Renderer: gles2 (Adreno GPU via freedreno; tested on the Urbane) or pixman (CPU, fallback)
RENDERER=gles2

# Hide the mouse pointer that touch input makes appear (1/0)
HIDE_POINTER=1

# Start the terminal session on the watch screen after autologin (1/0)
AUTOSTART=1

# On first start with no keyboard paired, offer to pair one (1/0)
AUTO_PAIR_KEYBOARD=1

# Compressed RAM swap size (urbane-zram service)
ZRAM_SIZE=256M

# Let the charger draw this much from USB (mA). 0 = leave the kernel default (500).
CHARGE_INPUT_MA=500

# Charging temperature guard (service urbane-chargeguard): above CHARGE_HOT_C the
# battery charge current drops to CHARGE_HOT_MA, back to CHARGE_MA below CHARGE_COOL_C.
CHARGE_MA=400
CHARGE_HOT_MA=200
CHARGE_HOT_C=45
CHARGE_COOL_C=42


# CPU (see: watch help cpu). The kernel starts with one core (maxcpus=1 inherited
# from the G Watch R port); urbane-hw applies these at boot.
#   CPU_CORES   1-4. Tested 2026-10-29/30 (full load, game server):
#                 powersave:   4 cores ok (also long server runs) - pins the clock
#                              at the LOWEST step, 300 MHz, whatever CPU_MAX_MHZ says
#                 performance: 3 @600 ok, 4 @384 crashed later, 4 @600 crash (any voltage)
#                 schedutil:   2 @600 ok, 3 @600 crash
#   CPU_GOVERNOR powersave (4 x 300 MHz, stable) / performance (fixed max clock) /
#               schedutil (scales with load)
#   CPU_MAX_MHZ cap the clock: 300 384 600 787 (empty = no cap; no effect with powersave)
#   CPU_IDLE    wfi = shallow idle only (no power collapse), all = default (empty)
#   CPU_LOG     1 = record breadcrumbs from boot (watch-cpu last after a crash)
CPU_CORES=4
CPU_MAX_MHZ=600
CPU_GOVERNOR=powersave
CPU_IDLE=
CPU_LOG=0
#   CPU_BOOT_RAMP  boot steps in seconds since power-on: "60 90" = 1 core at the lowest
#               clock until 60 s, 2 cores until 90 s, then the settings above. Empty = no
#               ramp (the settings apply right away). The watch reset at full speed right
#               after plugging in; the ramp lets it settle first.
CPU_BOOT_RAMP="60 90"
#   CPU_VOLT_MV CPU rail 1150..1280 mV (needs the 0.20 kernel; empty = bootloader's 1.15 V).
#               Tested: 1200/1250 did not make 4 cores stable.
CPU_VOLT_MV=

# your system settings (watch set KEY VALUE) - keep this last
# shellcheck disable=SC1091
[ -f /etc/urbane/watch.local.conf ] && . /etc/urbane/watch.local.conf
true
