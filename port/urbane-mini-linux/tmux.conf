# /etc/urbane/tmux.conf - tmux tuned for a tiny round screen.
# Prefix stays Ctrl-b. Status sits at the top centre, the widest visible line.
set -g escape-time 10
set -g history-limit 5000
set -g mouse on
set -g base-index 1
set -g renumber-windows on

set -g status on
set -g status-position top
set -g status-interval 15
set -g status-justify centre
set -g status-style "bg=default,fg=colour245"
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
# one centred line: "14:05 87% W B [1] 2"  (time, battery, WiFi, BT, windows)
# Kept in @watch-status-format so watch-viewport can move it down a row in "full".
set -g @watch-status-format "#[align=centre]#[fg=colour252]#(watch-status) #{W:#[fg=colour240]#I ,#[fg=colour39][#I] }"
set -g status-format[0] "#{E:@watch-status-format}"
set -g window-status-current-format "#[fg=colour39][#I]"
set -g window-status-format "#[fg=colour240]#I"
set -g window-status-separator " "

# --- keys that work WITHOUT the Ctrl-b prefix (60% keyboards: Fn + 1..5)
#   F1 menu   F2 next screen layout   F3 font -   F4 font +   F5 wide on/off
bind -n F1 run-shell -b "watch-menu"
bind -n F2 run-shell -b "watch-viewport --cycle"
bind -n F3 run-shell -b "watch-viewport -"
bind -n F4 run-shell -b "watch-viewport +"
bind -n F5 run-shell -b "wide --toggle"
# tapping the top status line opens the menu (touch works like a mouse click)
bind -n MouseDown1Status run-shell -b "watch-menu"
bind -n MouseDown1StatusLeft run-shell -b "watch-menu"
bind -n MouseDown1StatusRight run-shell -b "watch-menu"
bind -n MouseDown1StatusDefault run-shell -b "watch-menu"

# --- the same with the prefix: press Ctrl-b, release, then the key
bind m run-shell -b "watch-menu"
bind w run-shell "watch-viewport --cycle"
bind + run-shell "watch-viewport +"
bind - run-shell "watch-viewport -"
bind k new-window -n bt "bt-kbd; echo; read -p 'Enter to close' _"
bind W new-window -n wifi "nmtui"
bind r source-file /etc/urbane/tmux.conf \; display "tmux reloaded"

# put the status line where the current layout can show it (row 2 in "full")
run-shell -b "watch-viewport --status-only"
